spring.application.name=courier-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/courier_db
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-stacktrace=never

spring.data.redis.host=localhost
spring.data.redis.port=6379

grpc.client.order-service.address=static://localhost:9090
grpc.client.order-service.negotiation-type=plaintext